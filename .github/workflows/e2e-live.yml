name: Live end-to-end

# Runs the browser suite in e2e/live against a real backend and database. Started by hand (Actions tab) until it has
# been proven green in CI; the fast mocked suite in e2e/ runs on every pull request in ci.yml.
on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Backend branch to test against (default: a branch with the same name as this one, else main)"
        required: false

concurrency:
  group: e2e-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end tests (real backend and database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equigcc
          POSTGRES_PASSWORD: equigcc
          POSTGRES_DB: equigcc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equigcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # The tests need the API. Which backend branch: the one you asked for (manual run or the BACKEND_REF variable),
      # else a backend branch with the same name as this branch, else main. If the backend repository is private,
      # add the secret BACKEND_REPO_TOKEN (a token with read access to it).
      - name: Pick the backend branch
        id: backend
        env:
          ASKED: ${{ inputs.backend_ref || vars.BACKEND_REF }}
          SAME: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/arjunsambyal997/Carta-New-Backend.git"
          ref=main
          for candidate in "$ASKED" "$SAME"; do
            if [ -n "$candidate" ] && git ls-remote --exit-code --heads "$url" "$candidate" > /dev/null 2>&1; then
              ref="$candidate"
              break
            fi
          done
          echo "Testing against backend branch: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the backend
        uses: actions/checkout@v7
        with:
          repository: arjunsambyal997/Carta-New-Backend
          ref: ${{ steps.backend.outputs.ref }}
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: backend

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: "Build and start the backend (authenticator off, tests only)"
        working-directory: backend
        run: |
          mvn -B -ntp -DskipTests package
          DB_URL=jdbc:postgresql://localhost:5432/equigcc_e2e SERVER_PORT=8090 \
          DEV_SKIP_MFA=true RATE_LIMIT_ENABLED=false \
          nohup java -jar target/*-SNAPSHOT.jar > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8090/v3/api-docs > /dev/null && exit 0
            sleep 2
          done
          cat ../backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the end-to-end suite
        run: npm run test:e2e:live
        env:
          CI: "true"
          BACKEND_URL: http://localhost:8090
          API_URL: http://localhost:8090

      - name: Keep the report and the backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            backend.log
          retention-days: 7
