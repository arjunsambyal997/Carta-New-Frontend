name: Release

# Push to main: check, then publish an image tagged main and sha-<commit> (deployable by hand, never automatically).
# Push a tag vX.Y.Z: check, refuse the release if the changelog has no X.Y.Z entry, publish the image tagged vX.Y.Z,
#   then deploy it to production after a reviewer approves the "production" environment.
# Run manually with a version: redeploys an image that already exists, e.g. to go back to an older release.
#
# The server side (Caddy, blue-green scripts) lives in the backend repo's deploy/ folder; deploy the backend first
# on a new server. Needs, in Settings > Environments > production: secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
# DEPLOY_KNOWN_HOSTS, variable PRODUCTION_URL, and required reviewers. See docs/RELEASING.md.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to deploy (e.g. v1.3.0). It must already exist in the registry.
        required: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Clients learn about a release from /changelog (English and Arabic). No entry, no release.
      - name: Release notes exist for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "version: \"$version\"" src/features/changelog/releases.ts; then
            echo "::error::Add a $version entry (en and ar) to src/features/changelog/releases.ts before tagging"
            exit 1
          fi

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.image.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config

      - name: Deploy (blue-green)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # VERSION goes into a remote command line: allow tag characters only.
          [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad version $VERSION"; exit 1; }
          # The job's own token can pull this repo's image; it expires when the job ends. Sent on stdin, not argv.
          printf '%s' "$TOKEN" | ssh target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" >/dev/null
          # shellcheck disable=SC2029  # expanding VERSION locally is intended
          ssh target "/opt/sijill/deploy.sh frontend '$VERSION'"

      - name: Sign the server out of the registry
        if: always()
        run: ssh target 'docker logout ghcr.io' || true
